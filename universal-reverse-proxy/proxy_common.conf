# Included in every service location. nginx drops all inherited
# proxy_set_header directives as soon as a location sets its own, so the
# common ones live here and every location includes them.
proxy_set_header Host $http_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Home Assistant user info stays inside the proxy. An empty value removes the
# header, so a browser can't inject its own Remote-User/Remote-Role either.
proxy_set_header X-Remote-User-Id "";
proxy_set_header X-Remote-User-Name "";
proxy_set_header X-Remote-User-Display-Name "";
proxy_set_header X-Remote-User-Groups "";
