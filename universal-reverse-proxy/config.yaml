---
name: Universal Reverse Proxy
version: 0.6.1
slug: universal_reverse_proxy
description: Ingress proxy for several externally hosted web apps, each with its own sidebar entry (does not run the apps itself)
url: https://github.com/pvillmann/hassio-addon-universal-proxy
arch:
  - armv7
  - aarch64
  - amd64
startup: application
panel_icon: mdi:swap-horizontal
panel_title: Proxy
# must stay false: the per-service panels use this add-on's ingress, an
# admin-only add-on would lock non-admins out of every service
panel_admin: false
boot: auto
stage: experimental
ingress: true
ingress_stream: true
ingress_port: 8099
init: true
timeout: 30
watchdog: http://[HOST]:[PORT:8099]/healthz
options:
  catalog_updates: true
  services:
    - name: evcc
      template: evcc
      url: http://evcc.local:7070
schema:
  catalog_updates: bool
  services:
    - name: str
      template: str?
      url: url
      secret: password?
      icon: str?
      admin_only: bool?
      user_headers: bool?
      headers:
        - str?
