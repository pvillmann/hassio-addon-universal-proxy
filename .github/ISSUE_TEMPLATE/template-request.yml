name: Template request
description: Ask for a template for any web app
title: "[Template] "
labels: ["template-request"]
body:
  - type: markdown
    attributes:
      value: |
        Every app is welcome. A template brings the right icon, admin default and setup notes, and handles what an app needs beyond a plain proxy (a subpath, a login by header, a legacy charset). Fill in what you know, the rest we find out.
  - type: input
    id: app
    attributes:
      label: App
      description: Name and link to the website or repository
      placeholder: Grafana, https://grafana.com
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version you use
      placeholder: "11.3.0"
  - type: dropdown
    id: basepath
    attributes:
      label: Can the app run under a subpath?
      options:
        - "Don't know"
        - "Yes, it reads a header (e.g. X-Ingress-Path, X-Forwarded-Prefix)"
        - "Yes, with its own setting (e.g. a base URL)"
        - "No"
  - type: dropdown
    id: auth
    attributes:
      label: Can the app take the logged-in user from a header?
      options:
        - "Don't know"
        - "Yes"
        - "No"
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Links to the docs, header login details, things you noticed
  - type: checkboxes
    id: testing
    attributes:
      label: Testing
      options:
        - label: I can test a template before it is published
