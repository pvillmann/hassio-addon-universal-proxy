name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
      - uses: actions/checkout@v4
      - run: apk add --no-cache nginx jq
      - name: Check the bundled templates and the nginx config
        run: sh tools/check-templates.sh universal-reverse-proxy/templates
